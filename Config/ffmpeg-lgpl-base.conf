# iBaiFFmpeg — shared LGPL-only FFmpeg configure flags (FFmpeg n8.1.x)
#
# Consumed by Scripts/load-ffmpeg-config.sh together with a platform overlay.
# Build scripts must still inject: --prefix, --arch, --cc/--cxx, sysroot CFLAGS, etc.
#
# Compliance: after configure, expect in ffbuild/config.h:
#   #define FFMPEG_CONFIGURATION "... --disable-gpl ..."
#   #define CONFIG_GPL 0
#   #define CONFIG_VERSION3 1
#
# Do NOT add: --enable-gpl, libx264, libmp3lame, libsmbclient, readline, or other GPL deps.

# --- License (LGPL v3 only) ---
--disable-gpl
--enable-version3
--disable-nonfree

# --- Build shape (static libs for xcframework; no CLI tools) ---
--disable-programs
--disable-doc
--disable-htmlpages
--disable-manpages
--disable-podpages
--disable-txtpages
--disable-debug
--enable-stripping
--disable-shared
--enable-static
--enable-pic
--enable-cross-compile
--enable-optimizations
--enable-runtime-cpudetect
--enable-thumb
--pkg-config-flags=--static

# --- CPU / arch tuning (overridden per-slice in platform overlays) ---
--disable-armv5te
--disable-armv6
--disable-armv6t2

# --- Disabled global features ---
--disable-bzlib
--disable-gray
--disable-iconv
--disable-linux-perf
--disable-small
--disable-swscale-alpha
--disable-symver
--disable-xlib

# --- Libraries (playback stack only; no avdevice/postproc) ---
--enable-avcodec
--enable-avformat
--enable-avutil
--enable-avfilter
--enable-swresample
--enable-swscale
--enable-network
--disable-devices
--disable-indevs
--disable-outdevs

# lavfi is used internally by the filter graph helpers in MEPlayer.
--enable-indev=lavfi

# --- Hardware accelerators we do not use on Apple ---
--disable-d3d11va
--disable-dxva2
--disable-vaapi
--disable-vdpau
--disable-hwaccel=av1_vulkan,hevc_vulkan,h264_vulkan

# --- Protocols (HTTP/HLS/RTSP streaming; no libsmbclient) ---
--disable-protocols
--enable-protocol=async
--enable-protocol=cache
--enable-protocol=concat
--enable-protocol=crypto
--enable-protocol=data
--enable-protocol=file
--enable-protocol=fd
--enable-protocol=http
--enable-protocol=httpproxy
--enable-protocol=https
--enable-protocol=icecast
--enable-protocol=pipe
--enable-protocol=rtp
--enable-protocol=subfile
--enable-protocol=tcp
--enable-protocol=tls
--enable-protocol=udp

# --- Demuxers (trimmed from iBai / FFmpeg playback set) ---
--disable-demuxers
--enable-demuxer=aac
--enable-demuxer=ac3
--enable-demuxer=aiff
--enable-demuxer=amr
--enable-demuxer=ape
--enable-demuxer=asf
--enable-demuxer=ass
--enable-demuxer=av1
--enable-demuxer=avi
--enable-demuxer=caf
--enable-demuxer=concat
--enable-demuxer=dash
--enable-demuxer=data
--enable-demuxer=dv
--enable-demuxer=eac3
--enable-demuxer=flac
--enable-demuxer=flv
--enable-demuxer=h264
--enable-demuxer=hevc
--enable-demuxer=hls
--enable-demuxer=live_flv
--enable-demuxer=loas
--enable-demuxer=m4v
--enable-demuxer=matroska
--enable-demuxer=mov
--enable-demuxer=mp3
--enable-demuxer=mpeg*
--enable-demuxer=nut
--enable-demuxer=ogg
--enable-demuxer=rm
--enable-demuxer=rtsp
--enable-demuxer=rtp
--enable-demuxer=srt
--enable-demuxer=vc1
--enable-demuxer=wav
--enable-demuxer=webm_dash_manifest

# --- Muxers (stream record / remux paths in MEPlayer) ---
--disable-muxers
--enable-muxer=dash
--enable-muxer=flac
--enable-muxer=hevc
--enable-muxer=m4v
--enable-muxer=matroska
--enable-muxer=mov
--enable-muxer=mp4
--enable-muxer=mpegts
--enable-muxer=nut
--enable-muxer=webm*

# --- Encoders (record/remux; all built-in LGPL) ---
--disable-encoders
--enable-encoder=aac
--enable-encoder=alac
--enable-encoder=flac
--enable-encoder=movtext
--enable-encoder=mpeg4
--enable-encoder=pcm*
--enable-encoder=prores

# --- Bitstream filters (VideoToolbox annex-B, AAC HLS, etc.) ---
--enable-bsfs

# --- Decoders ---
--disable-decoders
# Video (soft decode + passthrough to VT; AV1 native in FFmpeg 8)
--enable-decoder=av1
--enable-decoder=dca
--enable-decoder=dxv
--enable-decoder=ffv1
--enable-decoder=ffvhuff
--enable-decoder=flv
--enable-decoder=h263
--enable-decoder=h263i
--enable-decoder=h263p
--enable-decoder=h264
--enable-decoder=hap
--enable-decoder=hevc
--enable-decoder=huffyuv
--enable-decoder=indeo5
--enable-decoder=mjpeg
--enable-decoder=mjpegb
--enable-decoder=mpeg*
--enable-decoder=mts2
--enable-decoder=prores
--enable-decoder=rv10
--enable-decoder=rv20
--enable-decoder=rv30
--enable-decoder=rv40
--enable-decoder=snow
--enable-decoder=svq3
--enable-decoder=tscc
--enable-decoder=tscc2
--enable-decoder=txd
--enable-decoder=vc1
--enable-decoder=vp6
--enable-decoder=vp6a
--enable-decoder=vp6f
--enable-decoder=vp7
--enable-decoder=vp8
--enable-decoder=vp9
--enable-decoder=wmv1
--enable-decoder=wmv2
--enable-decoder=wmv3
# Audio
--enable-decoder=aac*
--enable-decoder=ac3*
--enable-decoder=adpcm*
--enable-decoder=alac*
--enable-decoder=amr*
--enable-decoder=ape
--enable-decoder=cook
--enable-decoder=dolby_e
--enable-decoder=eac3*
--enable-decoder=flac
--enable-decoder=gsm*
--enable-decoder=ilbc
--enable-decoder=mp1*
--enable-decoder=mp2*
--enable-decoder=mp3*
--enable-decoder=opus
--enable-decoder=pcm*
--enable-decoder=qdmc
--enable-decoder=qdm2
--enable-decoder=sonic
--enable-decoder=truehd
--enable-decoder=tta
--enable-decoder=vorbis
--enable-decoder=wma*
--enable-decoder=wrapped_avframe
# Subtitles (image + text; ASS decode is built-in, no libass)
--enable-decoder=ass
--enable-decoder=ccaption
--enable-decoder=dvbsub
--enable-decoder=dvdsub
--enable-decoder=mpl2
--enable-decoder=movtext
--enable-decoder=pgssub
--enable-decoder=srt
--enable-decoder=ssa
--enable-decoder=subrip
--enable-decoder=webvtt
--enable-decoder=xsub

# --- Filters (LGPL only; excludes boxblur/delogo and other gpl-only filters) ---
--disable-filters
--enable-filter=aformat
--enable-filter=amix
--enable-filter=anull
--enable-filter=aresample
--enable-filter=areverse
--enable-filter=asetrate
--enable-filter=atempo
--enable-filter=atrim
--enable-filter=bwdif
--enable-filter=equalizer
--enable-filter=estdif
--enable-filter=format
--enable-filter=fps
--enable-filter=gblur
--enable-filter=hflip
--enable-filter=hwdownload
--enable-filter=hwmap
--enable-filter=hwupload
--enable-filter=idet
--enable-filter=lenscorrection
--enable-filter=lut*
--enable-filter=negate
--enable-filter=null
--enable-filter=overlay
--enable-filter=palettegen
--enable-filter=paletteuse
--enable-filter=pan
--enable-filter=rotate
--enable-filter=scale
--enable-filter=setpts
--enable-filter=transpose
--enable-filter=trim
