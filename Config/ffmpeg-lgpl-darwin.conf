# Darwin (iOS / macOS / tvOS / visionOS) overlay — merged after ffmpeg-lgpl-base.conf

--target-os=darwin
--enable-libxml2

# Apple media frameworks (H.264/HEVC via VideoToolbox in iBai MEPlayer)
--enable-videotoolbox
--enable-audiotoolbox
--enable-hwaccel=h264_videotoolbox
--enable-hwaccel=hevc_videotoolbox

# VideoToolbox-backed filters used by VVOptions / MEPlayerItem
--enable-filter=yadif_videotoolbox
--enable-filter=scale_vt
--enable-filter=transpose_vt
