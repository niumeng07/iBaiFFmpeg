# Mac Catalyst overlay — SDK libs/frameworks for iOS do not always link for macabi.

--disable-libxml2
--disable-demuxer=dash
--disable-demuxer=webm_dash_manifest
--disable-muxer=dash
--disable-videotoolbox
--disable-audiotoolbox
--disable-hwaccel=h264_videotoolbox,hevc_videotoolbox
--disable-filter=yadif_videotoolbox
--disable-filter=scale_vt
--disable-filter=transpose_vt
